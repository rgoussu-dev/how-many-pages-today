name: Verify & deploy to GitHub Pages

# Pull requests are verified, never published. GitHub Pages is deployed only from `main`:
# on a push to it, or a manual run of this workflow on it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every action is pinned to a full commit SHA (the tag it was taken from is in the comment):
# a tag can be moved, a SHA cannot.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Typecheck (each package against its own lib — the domain has no DOM)
        run: npm run typecheck
      - name: Architecture walls (dependency-cruiser)
        run: npm run lint:arch
      - name: Unit & integration tests
        run: npm test
      - name: Build the PWA
        run: npm run build
      - name: Install Chromium for the end-to-end suite
        run: npx playwright install --with-deps chromium
      - name: End-to-end (real browser, production build, offline included)
        run: npm run e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          path: application/pwa/dist

  deploy:
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
