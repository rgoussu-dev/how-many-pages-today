<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>How Many Pages Today</title>
    <meta name="description" content="A daily reading challenge: one card, one picture, a number of pages. Works offline." />
    <meta name="theme-color" content="#4a2d18" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a110a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pages Today" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--
      The shell owns the templates and pages: it composes the module's port-bound
      elements with planks layout primitives. The elements themselves never know where
      they are mounted.
    -->
    <div class="app" data-booting>
      <main id="main" class="app-main">
        <center-pk maxWidth="34rem" gutters="var(--s0)">
          <section data-route="today" aria-label="Today">
            <stack-pk space="var(--s1)">
              <hmpt-greeting></hmpt-greeting>
              <hmpt-today-card
                data-tour="1"
                data-tour-title="Your daily card"
                data-tour-text="Each day I deal you a card: a picture and a number of pages. Read them, then press the button and I seal the day with wax. Read more, fewer — or finished your book? Tell me under “Read more, or fewer?”. Every page counts."
              ></hmpt-today-card>
              <hmpt-streak-summary
                data-tour="2"
                data-tour-title="Keep the candle lit"
                data-tour-text="Read a little every day and this candle keeps burning. Your pages, your books and your rank as a reader are kept here too."
              ></hmpt-streak-summary>
            </stack-pk>
          </section>

          <section data-route="progress" aria-label="Progress" hidden>
            <stack-pk space="var(--s1)">
              <h1>Your library</h1>
              <hmpt-streak-summary></hmpt-streak-summary>
              <hmpt-bookshelf></hmpt-bookshelf>
              <hmpt-history-calendar></hmpt-history-calendar>
              <hmpt-achievement-list></hmpt-achievement-list>
            </stack-pk>
          </section>

          <section data-route="overview" aria-label="Overview" hidden>
            <stack-pk space="var(--s1)">
              <h1>Your reading, looked back on</h1>
              <hmpt-reading-overview></hmpt-reading-overview>
            </stack-pk>
          </section>

          <section data-route="profile" aria-label="Profile and settings" hidden>
            <stack-pk space="var(--s1)">
              <h1>Your reading room</h1>
              <hmpt-profile-form></hmpt-profile-form>
              <hmpt-range-form></hmpt-range-form>
              <hmpt-reminder-form></hmpt-reminder-form>
              <p class="fleuron" aria-hidden="true">❦</p>
              <center-pk intrinsic><hmpt-welcome-replay></hmpt-welcome-replay></center-pk>
              <p class="muted app-footnote">Everything stays on this device. Clearing the browser's site data erases it.</p>
            </stack-pk>
          </section>
        </center-pk>
      </main>

      <nav class="tabbar" aria-label="Sections">
        <a href="#today" data-tab="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5" /></svg>
          <span>Today</span>
        </a>
        <a
          href="#progress"
          data-tab="progress"
          data-tour="3"
          data-tour-title="Your library"
          data-tour-text="Your shelf of finished books, a ledger of the last six weeks, and your bookplates — the achievements you earn along the way."
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3" /></svg>
          <span>Progress</span>
        </a>
        <a
          href="#overview"
          data-tab="overview"
          data-tour="4"
          data-tour-title="Looking back"
          data-tour-text="Your months and years of reading, looked back on: pages, days, books — and your best days."
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M9.3 20V5M14.6 20v-8M20 20V8M3 20h18" /></svg>
          <span>Overview</span>
        </a>
        <a
          href="#profile"
          data-tab="profile"
          data-tour="5"
          data-tour-title="Your reading room"
          data-tour-text="Your reader’s card, how big the daily challenge is, and a daily reminder at the hour you choose."
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
          <span>You</span>
        </a>
      </nav>
    </div>

    <hmpt-celebration></hmpt-celebration>
    <hmpt-welcome></hmpt-welcome>

    <noscript><p class="app-fatal">This app needs JavaScript to deal your daily card.</p></noscript>
  </body>
</html>
